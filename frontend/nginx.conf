# Serveert de Angular SPA. /api en /auth worden door Caddy naar backend en Keycloak gerouteerd.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker (F-26): altijd vers ophalen, anders blijven gebruikers op een oude versie hangen.
    # Staat vóór de regel voor gehashte bestanden: bij regex-locaties wint de eerste match.
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # Gehashte bestanden mogen lang gecachet worden, index.html nooit.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }
}
