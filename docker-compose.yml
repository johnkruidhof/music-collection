# Start alles met: docker compose up -d --build
# Daarna: https://<APP_HOST>  (standaard https://localhost)
name: music-collection

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?zet APP_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?zet KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"   # voor de backend vanuit IntelliJ en voor DB-tools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?zet KEYCLOAK_ADMIN_PASSWORD in .env}
      # Keycloak draait achter Caddy op https://<APP_HOST>/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${APP_HOST:-localhost}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm-music.json:/opt/keycloak/data/import/realm-music.json:ro
    ports:
      - "8180:8080"   # directe toegang, o.a. voor de JWKS-sleutels vanuit IntelliJ
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # string-vorm = CMD-SHELL (de lijstvorm geeft in IntelliJ onterecht "Single value is expected")
      test: >-
        exec 3<>/dev/tcp/127.0.0.1/9000 &&
        printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
        grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/musiccollection
      DB_USER: music
      DB_PASSWORD: ${APP_DB_PASSWORD}
      OIDC_ISSUER_URI: https://${APP_HOST:-localhost}/auth/realms/music
      OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/music/protocol/openid-connect/certs
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      AUDD_API_TOKEN: ${AUDD_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped

  # HTTPS-ingang voor alles (nodig voor camera/microfoon op de telefoon).
  # Routes: /api -> backend, /auth -> keycloak, de rest -> frontend.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
