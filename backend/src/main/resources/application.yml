spring:
  application:
    name: music-collection
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/musiccollection}
    username: ${DB_USER:music}
    password: ${DB_PASSWORD:music}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Moet exact overeenkomen met de 'iss' claim in het token (de publieke URL van Keycloak).
          issuer-uri: ${OIDC_ISSUER_URI:https://localhost/auth/realms/music}
          # Sleutels worden direct (intern) bij Keycloak opgehaald, niet via Caddy.
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/auth/realms/music/protocol/openid-connect/certs}
          audiences: music-backend

  servlet:
    multipart:
      # Covers worden in de browser al verkleind; dit is de bovengrens voor onbewerkte uploads.
      max-file-size: 10MB
      max-request-size: 11MB

  cache:
    type: caffeine
    cache-names: barcodeLookup,search,releaseDetails
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=24h

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  discogs:
    base-url: https://api.discogs.com
    token: ${DISCOGS_TOKEN:}
    user-agent: MusicCollection/@project.version@ +https://github.com/johnkruidhof/music-collection
    throttle:
      min-interval: 1s          # 60 requests/minuut met token
      max-retries: 2
      retry-backoff: 2s
  musicbrainz:
    base-url: https://musicbrainz.org/ws/2
    cover-art-base-url: https://coverartarchive.org
    user-agent: MusicCollection/@project.version@ ( johnkruidhof@gmail.com )
    throttle:
      min-interval: 1100ms      # max 1 request/seconde, iets marge
      max-retries: 2
      retry-backoff: 2s
  covers:
    cache-enabled: ${APP_COVERS_CACHE_ENABLED:true}
    max-attempts: 3
    batch-size: 25
    min-interval: 500ms
    backfill-initial-delay: PT1M
    backfill-interval: PT10M
  audd:
    base-url: https://api.audd.io
    api-token: ${AUDD_API_TOKEN:}
